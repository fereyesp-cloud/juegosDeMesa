<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <header class="encabezado" id="inicio">
            <div class="contenedor encabezado-contenido">
                <h1>Tu turno web</h1>
                <p>Bienvenido a Tu Turno Web</p>
                <a href="registro.html" class="boton-principal">Registrarse</a>
            </div>
        </header>
        <nav class="navegacion">
            <a href="index.html">Volver al inicio</a>
            <a href="juegos-rol.html">juegos de rol</a>
            <a href="juegos-familiares.html">Juegos familiares</a>
            <a href="juegos-estrategia.html">Juegos de estrategia</a>
            <a href="juegos-fiesta.html">Juegos de fiesta</a>
            <a href="registro.html">Registrarse</a>
        </nav>

        <main>
            <section class="login">
                <div class="contenedor">
                    <h2>Login</h2>
                    <form id="Login">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre de usuario</label>
                            <input type="text" class="form-control" id="username-login" placeholder="Usuario">
                            <div class="invalid-feedback" id="error-login"></div>
                        </div>
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="contrasena-login" placeholder="contrasena">
                                <button type="button" class="btn btn-outline-secondary" id="btn-ver-contrasena-login">👁</button>
                            </div>
                            <div class="invalid-feedback" id="error-contrasena-login"></div>
                        </div>
                        <button type="submit" class="btn btn-primary" id="ingreso-login">Ingresar</button>
                        <a href="recuperar-contrasena.html" class="btn btn-secondary">Recuperar contraseña</a>
                    </form>
                </div>
            </section>
        </main>
        <footer class="pie-pagina">
            <p>© 2026 Tu turno Web — Ejemplo académico DSY2202</p>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/login.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
